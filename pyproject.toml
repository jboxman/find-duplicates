[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "find-duplicates"
version = "1.0.0"
description = "A Click-based CLI for interacting with the Emy API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1,<9",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
]

[project.scripts]
find-duplicates = "find_duplicates.cli:main"

[tool.setuptools]
packages = ["find_duplicates"]
